[package]
name = "agricola-re-ai"
version = "0.1.0"
edition = "2021"
description = "Agricola Revised 2016 rules simulator prototype"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_chacha = { version = "0.3", features = ["serde1"] }
sha2 = "0.10"

[dev-dependencies]

# Optimized assertions with faster compile-time code generation for CI.
# Kept separate from production release so benchmark performance is unchanged.
[profile.ci-fast]
inherits = "release"
opt-level = 2
codegen-units = 32
