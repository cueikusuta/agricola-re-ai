[package]
name = "agricola-re-ai"
version = "0.1.0"
edition = "2021"
description = "Agricola Revised 2016 rules simulator prototype"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_chacha = { version = "0.3", features = ["serde1"] }
sha2 = "0.10"

[features]
# Build the perf_baseline harness with the counting global allocator ON, so
# allocation numbers can be measured without contaminating timing numbers:
# timing runs use the plain build (feature off), allocation runs use
# `--features perf-count-alloc`. See PR review P1 (allocator overhead).
perf-count-alloc = []

[dev-dependencies]
