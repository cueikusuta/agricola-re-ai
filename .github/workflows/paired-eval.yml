name: Paired AI Evaluation (cardless)

on:
  pull_request:
    paths:
      - 'src/bin/paired_eval.rs'
      - 'scripts/paired_eval_stats.py'
      - 'tests/test_paired_eval_stats.py'
      - '.github/workflows/paired-eval.yml'
  workflow_dispatch:
    inputs:
      players:
        description: 'Cardless players 2/3/4'
        type: choice
        options: ['2', '3', '4']
        default: '4'
        required: true
      blocks:
        description: 'Seed blocks (250 blocks x 4 seats = 1000 games per arm)'
        type: number
        default: 250
        required: true
      seed_start:
        description: 'Start of independent seed block range'
        type: string
        default: '500000'
        required: true
      candidate:
        description: 'Candidate AI (mcts = M7 card-aware search, puct = M8-3 PUCT)'
        type: choice
        options: ['eval', 'greedy', 'random', 'mcts', 'puct']
        default: 'eval'
        required: true
      baseline:
        type: choice
        options: ['random', 'greedy', 'eval', 'mcts', 'puct']
        default: 'greedy'
        required: true
      opponent:
        type: choice
        options: ['random', 'greedy', 'eval', 'mcts', 'puct']
        default: 'greedy'
        required: true
      extra:
        type: boolean
        default: false
      decision_budget_ms:
        description: 'Per-decision MCTS budget in ms; 0 = no deadline (deterministic by simulation count)'
        type: number
        default: 10000
        required: true
      mcts_simulations:
        description: 'MCTS simulations per decision (used for mcts arms)'
        type: number
        default: 64
        required: true
      mcts_tree_depth:
        description: 'MCTS tree depth per simulation (1-6)'
        type: number
        default: 2
        required: true
      puct_leaf:
        description: 'PUCT leaf value: terminal (rollout) or heuristic (eval leaf)'
        type: choice
        options: ['terminal', 'heuristic']
        default: 'terminal'
        required: true
      puct_simulations:
        description: 'PUCT simulations per decision'
        type: number
        default: 32
        required: true
      puct_tree_depth:
        description: 'PUCT tree depth per simulation (1-6)'
        type: number
        default: 2
        required: true
      puct_c:
        description: 'PUCT exploration constant'
        type: number
        default: 1.5
        required: true
      puct_prior_temp:
        description: 'Softmax temperature for evaluation priors'
        type: number
        default: 3
        required: true
      puct_value_temp:
        description: 'Softmax temperature for heuristic leaf credit'
        type: number
        default: 8
        required: true
      puct_root_limit:
        description: 'Top-prior root candidates to search (0 = all)'
        type: number
        default: 0
        required: true
      puct_final_prior:
        description: 'Weight of the evaluation prior in the final root choice'
        type: number
        default: 0
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - name: Build and unit-test evaluation
        run: |
          cargo test --release --locked --bin paired_eval
          cargo build --release --locked --bin paired_eval
          python3 -m unittest discover -s tests -p test_paired_eval_stats.py -v
      - name: Real smoke (2 blocks x 2 seats x 2 arms)
        run: |
          set -euo pipefail
          mkdir -p demo/shard-0
          ./target/release/paired_eval \
            --players 2 --seed-start 60000 --block-start 0 --blocks 2 \
            --candidate eval --baseline random --opponent greedy \
            --additional-action-space false \
            --output demo/shard-0/matches.jsonl
          python3 scripts/paired_eval_stats.py \
            --root demo --players 2 --seed-start 60000 --blocks 2 \
            --candidate eval --baseline random --opponent greedy \
            --output demo/report.json
      - name: Save smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-eval-pr-smoke
          path: demo/
          if-no-files-found: warn
          retention-days: 7

  shard:
    if: github.event_name == 'workflow_dispatch'
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      PLAYERS: ${{ inputs.players }}
      BLOCKS: ${{ inputs.blocks }}
      SEED_START: ${{ inputs.seed_start }}
      CANDIDATE: ${{ inputs.candidate }}
      BASELINE: ${{ inputs.baseline }}
      OPPONENT: ${{ inputs.opponent }}
      EXTRA: ${{ inputs.extra }}
      DECISION_BUDGET_MS: ${{ inputs.decision_budget_ms }}
      MCTS_SIMULATIONS: ${{ inputs.mcts_simulations }}
      MCTS_TREE_DEPTH: ${{ inputs.mcts_tree_depth }}
      PUCT_LEAF: ${{ inputs.puct_leaf }}
      PUCT_SIMULATIONS: ${{ inputs.puct_simulations }}
      PUCT_TREE_DEPTH: ${{ inputs.puct_tree_depth }}
      PUCT_C: ${{ inputs.puct_c }}
      PUCT_PRIOR_TEMP: ${{ inputs.puct_prior_temp }}
      PUCT_VALUE_TEMP: ${{ inputs.puct_value_temp }}
      PUCT_ROOT_LIMIT: ${{ inputs.puct_root_limit }}
      PUCT_FINAL_PRIOR: ${{ inputs.puct_final_prior }}
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --bin paired_eval
      - name: Evaluate distinct complete seed blocks
        shell: bash
        run: |
          set -euo pipefail
          INDEX=${{ matrix.shard }}
          test "$BLOCKS" -ge 4
          test "$BLOCKS" -le 1000
          test "$SEED_START" -ge 0
          test "$CANDIDATE" != "$BASELINE"
          BLOCK_START=$(( BLOCKS * INDEX / 4 ))
          BLOCK_END=$(( BLOCKS * (INDEX + 1) / 4 ))
          COUNT=$(( BLOCK_END - BLOCK_START ))
          mkdir -p "results/shard-$INDEX"
          ./target/release/paired_eval \
            --players "$PLAYERS" --seed-start "$SEED_START" \
            --block-start "$BLOCK_START" --blocks "$COUNT" \
            --candidate "$CANDIDATE" --baseline "$BASELINE" \
            --opponent "$OPPONENT" --additional-action-space "$EXTRA" \
            --decision-budget-ms "$DECISION_BUDGET_MS" \
            --mcts-simulations "$MCTS_SIMULATIONS" \
            --mcts-tree-depth "$MCTS_TREE_DEPTH" \
            --puct-leaf "$PUCT_LEAF" \
            --puct-simulations "$PUCT_SIMULATIONS" \
            --puct-tree-depth "$PUCT_TREE_DEPTH" \
            --puct-c "$PUCT_C" \
            --puct-prior-temp "$PUCT_PRIOR_TEMP" \
            --puct-value-temp "$PUCT_VALUE_TEMP" \
            --puct-root-limit "$PUCT_ROOT_LIMIT" \
            --puct-final-prior "$PUCT_FINAL_PRIOR" \
            --output "results/shard-$INDEX/matches.jsonl"
      - name: Save results and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: results/shard-${{ matrix.shard }}/
          if-no-files-found: warn
          retention-days: 7

  aggregate:
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    needs: [test, shard]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PLAYERS: ${{ inputs.players }}
      BLOCKS: ${{ inputs.blocks }}
      SEED_START: ${{ inputs.seed_start }}
      CANDIDATE: ${{ inputs.candidate }}
      BASELINE: ${{ inputs.baseline }}
      OPPONENT: ${{ inputs.opponent }}
      EXTRA: ${{ inputs.extra }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: results
      - name: Verify all games and bootstrap blocks
        shell: bash
        run: |
          set -euo pipefail
          FLAGS=()
          if [[ "$EXTRA" == "true" ]]; then FLAGS+=(--extra); fi
          python3 scripts/paired_eval_stats.py \
            --root results --players "$PLAYERS" --seed-start "$SEED_START" \
            --blocks "$BLOCKS" --candidate "$CANDIDATE" \
            --baseline "$BASELINE" --opponent "$OPPONENT" \
            --output results/report.json "${FLAGS[@]}"
          echo 'Paired seeded seat-block comparison; MCTS arms use a per-decision search budget. NOT full-decision 10s enforcement or official-rule proof.' >> "$GITHUB_STEP_SUMMARY"
      - name: Save confidence interval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-eval-report
          path: results/report.json
          if-no-files-found: error
          retention-days: 7
