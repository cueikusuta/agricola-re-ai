name: Paired AI Evaluation

on:
  pull_request:
    paths:
      - 'src/bin/paired_eval.rs'
      - 'src/cards.rs'
      - 'scripts/paired_eval_stats.py'
      - 'tests/test_paired_eval_stats.py'
      - '.github/workflows/paired-eval.yml'
  workflow_dispatch:
    inputs:
      players:
        description: 'Cardless players 2/3/4'
        type: choice
        options: ['2', '3', '4']
        default: '4'
        required: true
      blocks:
        description: 'Seed blocks (250 blocks x 4 seats = 1000 games per arm)'
        type: number
        default: 250
        required: true
      seed_start:
        description: 'Start of independent seed block range'
        type: string
        default: '500000'
        required: true
      candidate:
        description: 'Candidate AI (mcts = M7 card-aware search, puct = M8-3 PUCT)'
        type: choice
        options: ['eval', 'eval_veg', 'eval_food', 'eval_veg_cond', 'eval_room', 'greedy', 'random', 'mcts', 'puct']
        default: 'eval'
        required: true
      baseline:
        type: choice
        options: ['random', 'greedy', 'eval', 'eval_veg', 'eval_food', 'eval_veg_cond', 'eval_room', 'mcts', 'puct']
        default: 'greedy'
        required: true
      opponent:
        type: choice
        options: ['random', 'greedy', 'eval', 'eval_veg', 'eval_food', 'eval_veg_cond', 'eval_room', 'mcts', 'puct']
        default: 'greedy'
        required: true
      extra:
        type: boolean
        default: false
      cards:
        description: 'Card condition; verified is the built-in 2-player A/B pool only'
        type: choice
        options: ['none', 'verified_basic_2p']
        default: 'none'
        required: true
      decision_budget_ms:
        description: 'Per-decision search budget in ms; required by time-budgeted, unused by simulation-capped'
        type: number
        default: 10000
        required: true
      search_mode:
        description: 'simulation-capped (fixed count, reproducible) or time-budgeted (fixed wall clock, not reproducible)'
        type: choice
        options: ['simulation-capped', 'time-budgeted']
        default: 'simulation-capped'
        required: true
      time_budget_max_simulations:
        description: 'Safety cap on simulations inside one time-budgeted decision'
        type: number
        default: 100000
        required: true
      mcts_simulations:
        description: 'MCTS simulations per decision (used for mcts arms)'
        type: number
        default: 64
        required: true
      mcts_tree_depth:
        description: 'MCTS tree depth per simulation (1-6)'
        type: number
        default: 2
        required: true

      puct_leaf:
        description: 'PUCT leaf value: terminal (rollout) or heuristic (eval leaf)'
        type: choice
        options: ['terminal', 'heuristic']
        default: 'terminal'
        required: true
      puct_simulations:
        description: 'PUCT simulations per decision'
        type: number
        default: 32
        required: true
      puct_tree_depth:
        description: 'PUCT tree depth per simulation (1-6)'
        type: number
        default: 2
        required: true
      puct_c:
        description: 'PUCT exploration constant'
        type: number
        default: 1.5
        required: true
      puct_prior_temp:
        description: 'Softmax temperature for evaluation priors'
        type: number
        default: 3
        required: true
      puct_value_temp:
        description: 'Softmax temperature for heuristic leaf credit'
        type: number
        default: 8
        required: true
      puct_root_limit:
        description: 'Top-prior root candidates to search (0 = all)'
        type: number
        default: 0
        required: true
      puct_final_prior:
        description: 'Weight of the evaluation prior in the final root choice'
        type: number
        default: 0
        required: true
      baseline_puct_simulations:
        description: 'Baseline-arm PUCT simulations (freeze all eight baseline-puct inputs together, #219)'
        type: number
        default: 32
        required: true
      baseline_puct_tree_depth:
        type: number
        default: 2
        required: true
      baseline_puct_c:
        type: number
        default: 1.5
        required: true
      baseline_puct_prior_temp:
        type: number
        default: 3
        required: true
      baseline_puct_value_temp:
        type: number
        default: 8
        required: true
      baseline_puct_leaf:
        type: choice
        options: ['terminal', 'heuristic']
        default: 'terminal'
        required: true
      baseline_puct_root_limit:
        type: number
        default: 0
        required: true
      baseline_puct_final_prior:
        type: number
        default: 0
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - name: Build and unit-test evaluation
        run: |
          cargo test --release --locked --bin paired_eval
          cargo build --release --locked --bin paired_eval
          python3 -m unittest discover -s tests -p test_paired_eval_stats.py -v
      - name: Real smoke (2 blocks x 2 seats x 2 arms)
        run: |
          set -euo pipefail
          mkdir -p demo/shard-0
          ./target/release/paired_eval \
            --players 2 --seed-start 60000 --block-start 0 --blocks 2 \
            --candidate eval --baseline random --opponent greedy \
            --additional-action-space false \
            --output demo/shard-0/matches.jsonl
          python3 scripts/paired_eval_stats.py \
            --root demo --players 2 --seed-start 60000 --blocks 2 \
            --candidate eval --baseline random --opponent greedy \
            --output demo/report.json
      - name: Real smoke in the verified two-player card condition
        run: |-
          set -euo pipefail
          mkdir -p demo-cards/shard-0
          ./target/release/paired_eval \
            --players 2 --seed-start 61000 --block-start 0 --blocks 2 \
            --candidate eval --baseline random --opponent greedy \
            --additional-action-space false --cards verified \
            --decision-budget-ms 0 \
            --output demo-cards/shard-0/matches.jsonl
          python3 scripts/paired_eval_stats.py \
            --root demo-cards --players 2 --seed-start 61000 --blocks 2 \
            --candidate eval --baseline random --opponent greedy \
            --cards verified_basic_2p \
            --output demo-cards/report.json
      - name: PUCT with implemented two-player cards and replay smoke
        run: |
          set -euo pipefail
          mkdir -p demo-puct-cards/shard-0
          ./target/release/paired_eval \
            --players 2 --seed-start 62000 --block-start 0 --blocks 1 \
            --candidate puct --baseline eval --opponent greedy \
            --additional-action-space false --cards verified \
            --decision-budget-ms 0 --puct-leaf terminal \
            --puct-simulations 3 --puct-tree-depth 1 \
            --output demo-puct-cards/shard-0/matches.jsonl
          python3 scripts/paired_eval_stats.py \
            --root demo-puct-cards --players 2 --seed-start 62000 --blocks 1 \
            --candidate puct --baseline eval --opponent greedy \
            --cards verified_basic_2p --output demo-puct-cards/report.json
      - name: 4P direct PUCT vs MCTS mirror-control pilot (4 blocks, 32 games)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p demo-direct/shard-0
          # 4 seed blocks x 4 focus seats x 2 arms. All 3 opponents are
          # MCTS: candidate is PUCT vs MCTS x3; baseline is MCTS mirror.
          # This is a simulation-count-matched *pilot*, NOT a 10s or +5pp claim.
          ./target/release/paired_eval \
            --players 4 --seed-start 64000 --block-start 0 --blocks 4 \
            --candidate puct --baseline mcts --opponent mcts \
            --additional-action-space false --cards none \
            --search-mode simulation-capped --decision-budget-ms 0 \
            --mcts-simulations 4 --mcts-tree-depth 1 \
            --puct-simulations 4 --puct-tree-depth 1 --puct-leaf terminal \
            --output demo-direct/shard-0/matches.jsonl
          python3 scripts/paired_eval_stats.py \
            --root demo-direct --players 4 --seed-start 64000 --blocks 4 \
            --candidate puct --baseline mcts --opponent mcts \
            --cards none --search-mode simulation-capped \
            --output demo-direct/report.json
          python3 -c 'import json; r=json.load(open("demo-direct/report.json")); assert r["comparison_design"]["head_to_head"] is True; assert r["comparison_design"]["mirror_baseline"] is True; assert r["players"]==4 and r["games_per_arm"]==16 and r["total_games"]==32; assert r["search_mode"]=="simulation-capped"; assert len(r["paired_block_bootstrap_95ci"])==2; print("Direct PUCT vs MCTS pilot contract verified; not a strength claim")'
      - name: PUCT-vs-PUCT ablation smoke with a frozen baseline (#219)
        run: |
          set -euo pipefail
          mkdir -p demo-h2h/shard-0
          ./target/release/paired_eval \
            --players 2 --seed-start 64000 --block-start 0 --blocks 1 \
            --candidate puct --baseline puct --opponent puct \
            --additional-action-space false \
            --puct-c 2.5 \
            --baseline-puct-simulations 32 --baseline-puct-tree-depth 2 \
            --baseline-puct-c 1.5 --baseline-puct-prior-temp 3 \
            --baseline-puct-value-temp 8 --baseline-puct-leaf terminal \
            --baseline-puct-root-limit 0 --baseline-puct-final-prior 0 \
            --output demo-h2h/shard-0/matches.jsonl
          python3 scripts/paired_eval_stats.py \
            --root demo-h2h --players 2 --seed-start 64000 --blocks 1 \
            --candidate puct --baseline puct --opponent puct \
            --output demo-h2h/report.json
          python3 -c 'import json; r=json.load(open("demo-h2h/report.json")); assert r["candidate_puct_config_id"] != r["baseline_puct_config_id"]; assert r["comparison_design"]["head_to_head"] is True; assert r["candidate"] == r["baseline"] == "puct"; print("PUCT-vs-PUCT frozen-baseline smoke verified")'
      - name: Real smoke in the time-budgeted search mode
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p demo-time/shard-0
          ./target/release/paired_eval \
            --players 2 --seed-start 63000 --block-start 0 --blocks 1 \
            --candidate mcts --baseline eval --opponent greedy \
            --additional-action-space false \
            --search-mode time-budgeted --decision-budget-ms 60 \
            --mcts-tree-depth 2 \
            --output demo-time/shard-0/matches.jsonl
          python3 scripts/paired_eval_stats.py \
            --root demo-time --players 2 --seed-start 63000 --blocks 1 \
            --candidate mcts --baseline eval --opponent greedy \
            --search-mode time-budgeted \
            --output demo-time/report.json
      - name: Save smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-eval-pr-smoke
          path: |
            demo/
            demo-cards/
            demo-puct-cards/
            demo-h2h/
            demo-time/
            demo-direct/
          if-no-files-found: warn
          retention-days: 7

  shard:
    if: github.event_name == 'workflow_dispatch'
    needs: [test]
    runs-on: ubuntu-24.04
    # 8 shards x up to 32 blocks; a full four-player PUCT-vs-PUCT arm pair
    # takes roughly 14 s per game on a standard runner, so the widest shard
    # needs well under two hours including the build.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      PLAYERS: ${{ inputs.players }}
      BLOCKS: ${{ inputs.blocks }}
      SEED_START: ${{ inputs.seed_start }}
      CANDIDATE: ${{ inputs.candidate }}
      BASELINE: ${{ inputs.baseline }}
      OPPONENT: ${{ inputs.opponent }}
      EXTRA: ${{ inputs.extra }}
      CARDS: ${{ inputs.cards }}
      SEARCH_MODE: ${{ inputs.search_mode }}
      TIME_BUDGET_MAX_SIMULATIONS: ${{ inputs.time_budget_max_simulations }}
      DECISION_BUDGET_MS: ${{ inputs.decision_budget_ms }}
      MCTS_SIMULATIONS: ${{ inputs.mcts_simulations }}
      MCTS_TREE_DEPTH: ${{ inputs.mcts_tree_depth }}
      PUCT_LEAF: ${{ inputs.puct_leaf }}
      PUCT_SIMULATIONS: ${{ inputs.puct_simulations }}
      PUCT_TREE_DEPTH: ${{ inputs.puct_tree_depth }}
      PUCT_C: ${{ inputs.puct_c }}
      PUCT_PRIOR_TEMP: ${{ inputs.puct_prior_temp }}
      PUCT_VALUE_TEMP: ${{ inputs.puct_value_temp }}
      PUCT_ROOT_LIMIT: ${{ inputs.puct_root_limit }}
      PUCT_FINAL_PRIOR: ${{ inputs.puct_final_prior }}
      BASELINE_PUCT_SIMULATIONS: ${{ inputs.baseline_puct_simulations }}
      BASELINE_PUCT_TREE_DEPTH: ${{ inputs.baseline_puct_tree_depth }}
      BASELINE_PUCT_C: ${{ inputs.baseline_puct_c }}
      BASELINE_PUCT_PRIOR_TEMP: ${{ inputs.baseline_puct_prior_temp }}
      BASELINE_PUCT_VALUE_TEMP: ${{ inputs.baseline_puct_value_temp }}
      BASELINE_PUCT_LEAF: ${{ inputs.baseline_puct_leaf }}
      BASELINE_PUCT_ROOT_LIMIT: ${{ inputs.baseline_puct_root_limit }}
      BASELINE_PUCT_FINAL_PRIOR: ${{ inputs.baseline_puct_final_prior }}
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --bin paired_eval
      - name: Evaluate distinct complete seed blocks
        shell: bash
        run: |
          set -euo pipefail
          INDEX=${{ matrix.shard }}
          # Eight shards: every shard must receive at least one seed block.
          test "$BLOCKS" -ge 8
          test "$BLOCKS" -le 1000
          test "$SEED_START" -ge 0
          # Same policy names are allowed only for the #219 PUCT-vs-PUCT
          # ablation; the binary itself fails closed unless the eight
          # baseline-puct-* flags pin a configuration distinct from the
          # candidate configuration.
          if [ "$CANDIDATE" = "$BASELINE" ]; then test "$CANDIDATE" = "puct"; fi
          if [[ "$CARDS" != "none" ]]; then test "$PLAYERS" -eq 2; fi
          if [[ "$SEARCH_MODE" == "time-budgeted" ]]; then test "$DECISION_BUDGET_MS" -gt 0; fi
          BLOCK_START=$(( BLOCKS * INDEX / 8 ))
          BLOCK_END=$(( BLOCKS * (INDEX + 1) / 8 ))
          COUNT=$(( BLOCK_END - BLOCK_START ))
          mkdir -p "results/shard-$INDEX"
          ./target/release/paired_eval \
            --players "$PLAYERS" --seed-start "$SEED_START" \
            --block-start "$BLOCK_START" --blocks "$COUNT" \
            --candidate "$CANDIDATE" --baseline "$BASELINE" \
            --opponent "$OPPONENT" --additional-action-space "$EXTRA" \
            --cards "$CARDS" \
            --search-mode "$SEARCH_MODE" \
            --time-budget-max-simulations "$TIME_BUDGET_MAX_SIMULATIONS" \
            --decision-budget-ms "$DECISION_BUDGET_MS" \
            --mcts-simulations "$MCTS_SIMULATIONS" \
            --mcts-tree-depth "$MCTS_TREE_DEPTH" \
            --puct-leaf "$PUCT_LEAF" \
            --puct-simulations "$PUCT_SIMULATIONS" \
            --puct-tree-depth "$PUCT_TREE_DEPTH" \
            --puct-c "$PUCT_C" \
            --puct-prior-temp "$PUCT_PRIOR_TEMP" \
            --puct-value-temp "$PUCT_VALUE_TEMP" \
            --puct-root-limit "$PUCT_ROOT_LIMIT" \
            --puct-final-prior "$PUCT_FINAL_PRIOR" \
            --baseline-puct-simulations "$BASELINE_PUCT_SIMULATIONS" \
            --baseline-puct-tree-depth "$BASELINE_PUCT_TREE_DEPTH" \
            --baseline-puct-c "$BASELINE_PUCT_C" \
            --baseline-puct-prior-temp "$BASELINE_PUCT_PRIOR_TEMP" \
            --baseline-puct-value-temp "$BASELINE_PUCT_VALUE_TEMP" \
            --baseline-puct-leaf "$BASELINE_PUCT_LEAF" \
            --baseline-puct-root-limit "$BASELINE_PUCT_ROOT_LIMIT" \
            --baseline-puct-final-prior "$BASELINE_PUCT_FINAL_PRIOR" \
            --output "results/shard-$INDEX/matches.jsonl"
      - name: Save results and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: results/shard-${{ matrix.shard }}/
          if-no-files-found: warn
          retention-days: 7

  aggregate:
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    needs: [test, shard]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PLAYERS: ${{ inputs.players }}
      BLOCKS: ${{ inputs.blocks }}
      SEED_START: ${{ inputs.seed_start }}
      CANDIDATE: ${{ inputs.candidate }}
      BASELINE: ${{ inputs.baseline }}
      OPPONENT: ${{ inputs.opponent }}
      EXTRA: ${{ inputs.extra }}
      CARDS: ${{ inputs.cards }}
      SEARCH_MODE: ${{ inputs.search_mode }}
      DECISION_BUDGET_MS: ${{ inputs.decision_budget_ms }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: results
      - name: Verify all games and bootstrap blocks
        shell: bash
        run: |
          set -euo pipefail
          FLAGS=()
          if [[ "$EXTRA" == "true" ]]; then FLAGS+=(--extra); fi
          python3 scripts/paired_eval_stats.py \
            --root results --players "$PLAYERS" --seed-start "$SEED_START" \
            --blocks "$BLOCKS" --candidate "$CANDIDATE" \
            --baseline "$BASELINE" --opponent "$OPPONENT" \
            --cards "$CARDS" \
            --search-mode "$SEARCH_MODE" \
            --output results/report.json "${FLAGS[@]}"
          echo "Search mode: $SEARCH_MODE (decision budget ${DECISION_BUDGET_MS} ms). Fixed simulation counts and fixed wall-clock budgets are different experiments and are never pooled." >> "$GITHUB_STEP_SUMMARY"
          echo 'Paired seeded seat-block comparison; search arms use a per-decision search budget. NOT full-decision 10s enforcement or official-rule proof.' >> "$GITHUB_STEP_SUMMARY"
      - name: Save confidence interval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-eval-report
          path: results/report.json
          if-no-files-found: error
          retention-days: 7
