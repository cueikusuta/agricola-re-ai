name: Temporary M7 rustfmt
on:
  push:
    branches: [feature/m7-card-local-ui]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m7-card-local-ui
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: |
          cargo fmt --all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          if ! git diff --cached --quiet; then
            git commit -m 'style(m7): format card API after self-review'
            git push origin HEAD:feature/m7-card-local-ui
          fi
