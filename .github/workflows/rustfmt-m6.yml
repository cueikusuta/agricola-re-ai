name: Temporary M6 auto-format
on:
  push:
    branches: [feature/m6-hidden-hand-mcts]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m6-hidden-hand-mcts
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and commit
        run: |
          cargo fmt --all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          if ! git diff --cached --quiet; then
            git commit -m 'style(m6): rustfmt self-review corrections'
            git push origin HEAD:feature/m6-hidden-hand-mcts
          fi
