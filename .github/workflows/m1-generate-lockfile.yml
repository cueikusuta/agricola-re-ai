name: Generate tracked Cargo.lock (one-time)
on:
  push:
    branches:
      - issue/45-m1-final-stables-audit
permissions:
  contents: write
jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate lockfile on CI runner
        run: cargo generate-lockfile
      - name: Commit lockfile to M1 review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "build: track Cargo.lock for reproducible M1 CI"
            git push origin HEAD:issue/45-m1-final-stables-audit
          fi
