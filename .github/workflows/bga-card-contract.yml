name: BGA Card Spec Contract

on:
  pull_request:
    paths:
      - "data/bga-card-specs/**"
      - "data/bga-card-tests/**"
      - "schemas/bga-card-*.schema.json"
      - "scripts/validate_bga_card_specs.py"
      - "scripts/build_bga_card_specs.py"
      - "scripts/validate_json_schema.py"
      - "tests/test_bga_card_specs_builder.py"
      - "docs/card-catalog-ae-preliminary.csv"
      - ".github/workflows/bga-card-contract.yml"
  push:
    branches: [main]
    paths:
      - "data/bga-card-specs/**"
      - "data/bga-card-tests/**"
      - "schemas/bga-card-*.schema.json"
      - "scripts/validate_bga_card_specs.py"
      - "scripts/build_bga_card_specs.py"
      - "scripts/validate_json_schema.py"
      - "tests/test_bga_card_specs_builder.py"
      - "docs/card-catalog-ae-preliminary.csv"
      - ".github/workflows/bga-card-contract.yml"

jobs:
  bga-spec-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate BGA card-spec coverage and references
        run: python3 scripts/validate_bga_card_specs.py
      - name: Check builder reproducibility against committed snapshots
        run: python3 -m unittest discover -s tests -p "test_bga_card_specs_builder.py" -v
