name: Mode-wide Simulator Verification

# Issue #108 / #110: per-game verification for every supported cardless mode.
#
# The required PR CI only runs the short sweep in `tests/mode_verification.rs`.
# This workflow auto-runs on relevant main changes, and remains manually runnable.
# Heavy verification never extends the 60-second pull-request CI gate.
#
# Every game is checked for: 14-round completion, final-state invariants,
# full-log replay with per-action invariant checks, save/restore round-trip,
# structural observation privacy and fixed-seed reproducibility. Any failed
# game fails the job; the per-game JSONL and summary stay as artifacts.
#
# `aggregate` is fail closed: `scripts/mode_verify_summary.py` re-derives the
# triggered inputs, the six modes, every summary field and every per-game
# record, so a missing, duplicated, empty or mismatched artifact set fails.
on:
  push:
    branches: [main]
    paths:
      # Core game changes only; do not re-run 6,000 games for UI/draft-only work.
      - 'src/**'
      - '!src/web.rs'
      - '!src/draft*.rs'
      - '!src/bin/**'
      - 'src/bin/mode_verify.rs'
      - 'scripts/mode_verify_summary.py'
      - 'tests/mode_verification.rs'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - '.github/workflows/mode-verification.yml'
  workflow_dispatch:
    inputs:
      seeds:
        description: 'Seeds per mode (2/3/4 players x additional tile OFF/ON)'
        type: number
        default: 1000
        required: true
      seed_start:
        description: 'First seed (each mode uses the same range)'
        type: string
        default: '700000'
        required: true
      policy:
        description: 'Policy for every seat'
        type: choice
        options: ['eval', 'greedy', 'random']
        default: 'eval'
        required: true

permissions:
  contents: read

concurrency:
  group: mode-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  aggregator:
    name: Validate aggregation rules
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m unittest tests.test_mode_verify_summary -v

  verify:
    name: ${{ matrix.players }}P additional-tile-${{ matrix.extra }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        players: [2, 3, 4]
        extra: [false, true]
    env:
      SEEDS: ${{ github.event_name == 'push' && '1000' || inputs.seeds }}
      SEED_START: ${{ github.event_name == 'push' && '700000' || inputs.seed_start }}
      POLICY: ${{ github.event_name == 'push' && 'eval' || inputs.policy }}
      PLAYERS: ${{ matrix.players }}
      EXTRA: ${{ matrix.extra }}
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mode-verify
      - name: Build verification binary
        run: cargo build --release --locked --bin mode_verify
      - name: Run per-game verification
        shell: bash
        run: |
          set -euo pipefail
          FLAGS=()
          if [[ "$EXTRA" == "true" ]]; then FLAGS+=(--additional-action-space); fi
          OUT="results/mode-${PLAYERS}p-extra-${EXTRA}"
          # `tee` opens its file before the binary creates the output directory,
          # so a missing `results/` used to fail the job after a successful run
          # (observed in run 42497743020). Create both directories first and keep
          # stdout inside the run directory that the artifact upload already covers.
          mkdir -p results "$OUT"
          ./target/release/mode_verify \
            --players "$PLAYERS" --seeds "$SEEDS" --seed-start "$SEED_START" \
            --policy "$POLICY" --out "$OUT" "${FLAGS[@]}" | tee "$OUT/stdout.json"
      - name: Preserve evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mode-verify-${{ matrix.players }}p-extra-${{ matrix.extra }}
          path: results/
          if-no-files-found: warn
          retention-days: 14

  aggregate:
    name: Aggregate mode evidence
    if: always()
    needs: [aggregator, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SEEDS: ${{ github.event_name == 'push' && '1000' || inputs.seeds }}
      SEED_START: ${{ github.event_name == 'push' && '700000' || inputs.seed_start }}
      POLICY: ${{ github.event_name == 'push' && 'eval' || inputs.policy }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: mode-verify-*
          path: results
          merge-multiple: false
      - name: Require every verification job to succeed
        shell: bash
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          set -euo pipefail
          echo "verify matrix result: $VERIFY_RESULT"
          if [[ "$VERIFY_RESULT" != "success" ]]; then
            echo "at least one mode job did not succeed; evidence is incomplete" >&2
            exit 1
          fi
      - name: Verify every mode summary (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/mode_verify_summary.py             --root results --seeds "$SEEDS" --seed-start "$SEED_START"             --policy "$POLICY" --commit-sha "$GITHUB_SHA"             --output combined-mode-evidence.md             --json-output combined-mode-evidence.json
          cat combined-mode-evidence.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload combined evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mode-verify-combined
          path: |
            combined-mode-evidence.md
            combined-mode-evidence.json
          if-no-files-found: warn
          retention-days: 14
