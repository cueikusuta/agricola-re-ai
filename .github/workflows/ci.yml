name: Rust CI

# Feature branches are checked by pull_request; avoid duplicate push + PR runs.
# Keep the workflow running on documentation-only PRs so required checks are reported.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: rust-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed files
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      runtime: ${{ steps.filter.outputs.runtime }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        if: ${{ github.event_name != 'workflow_dispatch' }}
        id: filter
        with:
          # On push, compare with the previous commit on this branch.
          # On pull_request, paths-filter uses the PR base via the GitHub API.
          base: ${{ github.ref }}
          # Fail closed for newly introduced source/config paths: only explicit
          # documentation, test, and script exceptions can skip expensive jobs.
          # Every rule must match the same changed file for exclusions to work.
          predicate-quantifier: every
          filters: |
            rust:
              - '**'
              - '!docs/**'
              - '!**/*.md'
            runtime:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!tests/**'
              - '!scripts/**'

  format:
    name: rustfmt
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # Official Ubuntu images already include rustfmt. Avoid a redundant
      # rustup install that can stall on network/toolchain updates.
      - run: rustfmt --version && cargo fmt --all -- --check

  lint:
    name: clippy
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: cargo test
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-fast
          cache-on-failure: 'true'
      - name: Install nextest (prebuilt v0.9.151)
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.151
      # All --all-targets tests are executed, across test binaries in parallel.
      # The previous cargo test --all-targets also excluded doctests.
      # Cargo ci-fast inherits release semantics, with quicker opt2 codegen.
      # Compare warm/cold cache durations; restore --release if it regresses.
      - run: cargo nextest run --cargo-profile ci-fast --locked --all-targets
      - name: Check inline browser JavaScript syntax
        run: |
          sed -n '/<script>/,/<\/script>/p' web/index.html | sed '1d;$d' > /tmp/agricola-web.js
          node --check /tmp/agricola-web.js

  benchmark:
    name: M1/M2/M7 seeded performance
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.runtime == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          add-job-id-key: 'false'
      # Compile the release binary once: M1, M2 and M7 previously built the
      # same binary independently on separate runners, wasting build time.
      - name: Build shared release benchmark binary
        run: cargo build --release --locked
      - name: M1 100 games, additional tile OFF
        run: ./target/release/agricola-re-ai --batch 100 --seed 4200
      - name: M1 100 games, additional tile ON
        run: ./target/release/agricola-re-ai --batch 100 --seed 4200 --additional-action-space
      - name: M2 seed 7100, additional tile OFF
        run: ./target/release/agricola-re-ai --benchmark 50 --seed 7100
      - name: M2 seed 7100, additional tile ON
        run: ./target/release/agricola-re-ai --benchmark 50 --seed 7100 --additional-action-space
      - name: M2 held-out seed 26000, tile OFF
        run: ./target/release/agricola-re-ai --benchmark 20 --seed 26000
      - name: M2 held-out seed 26000, tile ON
        run: ./target/release/agricola-re-ai --benchmark 20 --seed 26000 --additional-action-space
      - name: M7 card-mode paired comparison OFF
        run: ./target/release/agricola-re-ai --benchmark-cards 10 --seed 901
      - name: M7 card-mode paired comparison ON
        run: ./target/release/agricola-re-ai --benchmark-cards 10 --seed 901 --additional-action-space

  gate:
    name: CI required
    if: ${{ always() }}
    needs: [changes, format, lint, test, benchmark]
    runs-on: ubuntu-24.04
    env:
      CHANGES: ${{ needs.changes.result }}
      RUST: ${{ needs.changes.outputs.rust }}
      RUNTIME: ${{ needs.changes.outputs.runtime }}
      FORCE: ${{ github.event_name == 'workflow_dispatch' }}
      FORMAT: ${{ needs.format.result }}
      LINT: ${{ needs.lint.result }}
      TEST: ${{ needs.test.result }}
      PERFORMANCE: ${{ needs.benchmark.result }}
    steps:
      - name: Require every applicable check to pass
        shell: bash
        run: |
          set -euo pipefail
          echo "changed-files=$CHANGES rust=$RUST runtime=$RUNTIME"
          echo "rustfmt=$FORMAT clippy=$LINT test=$TEST benchmark=$PERFORMANCE"
          [[ "$CHANGES" == success ]] || exit 1
          if [[ "$RUST" == true || "$FORCE" == true ]]; then
            [[ "$FORMAT" == success && "$LINT" == success && "$TEST" == success ]] || exit 1
          fi
          if [[ "$RUNTIME" == true || "$FORCE" == true ]]; then
            [[ "$PERFORMANCE" == success ]] || exit 1
          fi
