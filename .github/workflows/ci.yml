name: Rust CI
on:
  push:
    branches: [main, develop, 'issue/**']
  pull_request:
permissions:
  contents: read
jobs:
  format:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
  lint:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --all-targets

  benchmark:
    name: M1 100-game performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: 100 games with additional tile OFF
        run: cargo run --release --locked -- --batch 100 --seed 4200
      - name: 100 games with additional tile ON
        run: cargo run --release --locked -- --batch 100 --seed 4200 --additional-action-space

  m2_benchmark:
    name: M2 seeded head-to-head smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Additional tile OFF
        run: cargo run --release --locked -- --benchmark 12 --seed 7100
      - name: Additional tile ON
        run: cargo run --release --locked -- --benchmark 12 --seed 7100 --additional-action-space
      - name: M2 parameter calibration (diagnostic)
        run: cargo test --release --locked --test m2_tuning heldout_validation -- --ignored --nocapture
