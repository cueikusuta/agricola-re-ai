name: Temporary Rustfmt for M1 issue 25
on:
  push:
    branches:
      - issue/25-harvest-detail-policy
permissions:
  contents: write
jobs:
  apply-format:
    if: github.repository == 'cueikusuta/agricola-re-ai'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and commit
        shell: bash
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src tests
            git commit -m 'style: rustfmt harvest detail policy'
            git push origin HEAD:refs/heads/issue/25-harvest-detail-policy
          fi
