name: Temporary Rustfmt for M1 issue 23
on:
  push:
    branches:
      - issue/23-fencing-baking-accuracy
permissions:
  contents: write
jobs:
  apply-format:
    if: github.repository == 'cueikusuta/agricola-re-ai'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format code and commit if needed
        shell: bash
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/engine.rs src/policy.rs
            git commit -m 'style: apply rustfmt for M1 fencing/baking'
            git push origin HEAD:refs/heads/issue/23-fencing-baking-accuracy
          fi
