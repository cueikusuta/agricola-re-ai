name: Temporary Rustfmt source export
on:
  pull_request:
    types: [opened, reopened, synchronize]
permissions:
  contents: read
jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue/02-legal-validators
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Emit formatted changed source
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          paths = ["src/model.rs","tests/legal_invariants.rs"]
          print("FORMATTED_CONTENT_JSON:" + json.dumps([{"path":p,"content":Path(p).read_text()} for p in paths],ensure_ascii=True))
          PY
